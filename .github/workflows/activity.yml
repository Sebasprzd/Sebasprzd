name: Update activity snake

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/activity.yml

permissions:
  contents: write

concurrency:
  group: activity-snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate light and dark snake SVGs
        uses: Platane/snk/svg-only@v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.SNK_TOKEN || github.token }}
          outputs: |
            dist/activity-snake.svg?color_snake=%23b87912&color_dots=%23dbe3ee,%23cbd5e1,%23b87912,%23d99a2b,%230f766e
            dist/activity-snake-dark.svg?palette=github-dark&color_snake=%23f5c15c&color_dots=%23050b14,%230b1727,%23d99a2b,%23f5c15c,%235eead4

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v5.0.0
        with:
          target_branch: output
          build_dir: dist
          keep_history: true
          commit_message: "Update activity snake"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
